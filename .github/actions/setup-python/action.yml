name: Set up Python oracles
description: Install the pinned CPython interpreters used by tests and compatibility checks.

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        version: "0.13.0"
        enable-cache: false
    - name: Install pinned CPython interpreters
      shell: bash
      run: |
        uv python install --no-bin 3.14.5 3.15.0rc2

        python314="$(uv python find --managed-python 3.14.5)"
        python315="$(uv python find --managed-python 3.15.0rc2)"
        {
          echo "SERC_TEST_PYTHON=$python314"
          echo "SERC_TEST_PYTHON_315=$python315"
        } >> "$GITHUB_ENV"
        if [[ "$RUNNER_OS" != Linux ]]; then
          uv python install --no-bin 3.12.14 3.13.15
          python312="$(uv python find --managed-python 3.12.14)"
          python313="$(uv python find --managed-python 3.13.15)"
          {
            echo "SERC_TEST_PYTHON_312=$python312"
            echo "SERC_TEST_PYTHON_313=$python313"
          } >> "$GITHUB_ENV"
        fi
    - name: Install Linux CPython 3.12 and 3.13 CI reference builds
      if: runner.os == 'Linux'
      shell: bash
      run: |
        # These exact GCC builds preserve the legacy complex-division NaN bits.
        # See docs/cpython-build-profiles.md; release identity alone is insufficient.
        source /etc/os-release
        [[ "$ID" == ubuntu && "$VERSION_ID" == 24.04 && "$(uname -m)" == x86_64 ]]

        install_reference() {
          local version="$1" build="$2" sha256="$3"
          local short_version="${version%.*}"
          local prefix="$RUNNER_TEMP/serc-cpython-$version"
          local archive="$RUNNER_TEMP/serc-cpython-$version.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/actions/python-versions/releases/download/$version-$build/python-$version-linux-24.04-x64.tar.gz"
          printf '%s  %s\n' "$sha256" "$archive" | sha256sum --check --strict
          mkdir -p "$prefix"
          tar --extract --gzip --file "$archive" --directory "$prefix"
          # The archives embed their original toolcache prefix. Bind each relocated
          # interpreter to its own library without changing other oracles' loaders.
          printf '#!/bin/bash\nexport LD_LIBRARY_PATH=%q\nexec %q "$@"\n' \
            "$prefix/lib" "$prefix/bin/python$short_version" > "$prefix/python"
          chmod +x "$prefix/python"
        }
        install_reference 3.12.14 31661455385 5a03168292516f6dd6dcf630f4bf5369b108abd7c699a7e1db37f1e622257fff
        install_reference 3.13.15 31064747964 4e544242f8a4ef647a6f511b67f9b00eefc9ef366644e3c40a27a6eff709ae2b
        {
          echo "SERC_TEST_PYTHON_312=$RUNNER_TEMP/serc-cpython-3.12.14/python"
          echo "SERC_TEST_PYTHON_313=$RUNNER_TEMP/serc-cpython-3.13.15/python"
        } >> "$GITHUB_ENV"
    - name: Verify CPython 3.12.14 oracle
      shell: bash
      run: |
        "$SERC_TEST_PYTHON_312" -B -I -S -c "import compileall, importlib.util, json, marshal, py_compile, struct, sys; assert sys.implementation.name == 'cpython'; assert sys.version_info == (3, 12, 14, 'final', 0); assert importlib.util.MAGIC_NUMBER.hex() == 'cb0d0d0a'"
    - name: Verify CPython 3.13.15 oracle
      shell: bash
      run: |
        "$SERC_TEST_PYTHON_313" -B -I -S -c "import compileall, importlib.util, json, marshal, py_compile, struct, sys; assert sys.implementation.name == 'cpython'; assert sys.version_info == (3, 13, 15, 'final', 0); assert importlib.util.MAGIC_NUMBER.hex() == 'f30d0d0a'"
