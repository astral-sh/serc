name: Publish to PyPI

on:
  workflow_call:
    inputs:
      distributions:
        description: Artifact ID containing the verified wheels and source distribution
        required: true
        type: string

permissions: {}

env:
  ACTIONS_CACHE_MODE: none

jobs:
  publish:
    name: Upload Serc to PyPI
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.13.0"
          checksum: "1468ebd5a5541121837c5a2817b9972ba6090fa6caa3d142620850a47fb75154"
          enable-cache: false
      - name: Download verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.distributions }}
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*
